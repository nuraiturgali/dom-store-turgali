<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nurai Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Nurai Store</h1>

        <p class="subtitle">
            Simple Product Manager
        </p>

        <section class="form-section">

            <h2>Add Product</h2>

            <form id="product-form">

                <div class="form-group">
                    <label for="name">Product Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Coffee"
                    >

                    <span
                        class="error"
                        id="name-error"
                    ></span>
                </div>


                <div class="form-group">
                    <label for="price">Price</label>

                    <input
                        type="number"
                        id="price"
                        placeholder="1500"
                    >

                    <span
                        class="error"
                        id="price-error"
                    ></span>
                </div>


                <div class="form-group">
                    <label for="qty">Quantity</label>

                    <input
                        type="number"
                        id="qty"
                        placeholder="2"
                    >

                    <span
                        class="error"
                        id="qty-error"
                    ></span>
                </div>


                <button type="submit">
                    Add Product
                </button>

            </form>

        </section>


        <section class="products-section">

            <h2>Products</h2>

            <div id="product-list"></div>

            <div class="total">
                Total:
                <span id="total">0</span> ₸
            </div>

        </section>

    </main>


    <script src="Store.js"></script>
    <script src="app.js"></script>

</body>

</html>
